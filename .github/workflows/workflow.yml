name: CI - Build APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]

env:
  GRADLE_OPTS: "-Xmx3072m -Dfile.encoding=UTF-8"

permissions:
  contents: write

jobs:
  build:
    name: Build debug + release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Download Gradle 8.7 wrapper jars
        run: |
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          curl -L -o gradlew https://github.com/gradle/gradle/raw/v8.7.0/gradlew
          curl -L -o gradlew.bat https://github.com/gradle/gradle/raw/v8.7.0/gradlew.bat
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: dist/debug

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: dist/release

      - name: Rename release assets
        run: |
          cp dist/debug/app-debug.apk cline-agent-mobile-${{ github.ref_name }}-debug.apk
          cp dist/release/app-release-unsigned.apk cline-agent-mobile-${{ github.ref_name }}-release.apk
          ls -la *.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Cline Agent Mobile ${{ github.ref_name }}

            Build automatica da GitHub Actions.

            ### Download
            - Debug APK: installazione diretta per test.
            - Release APK: build release firmata con chiave debug (per testing, non Play Store).

            ### Build Info
            - Commit: ${{ github.sha }}
          files: |
            cline-agent-mobile-${{ github.ref_name }}-debug.apk
            cline-agent-mobile-${{ github.ref_name }}-release.apk
          draft: false
          prerelease: false

